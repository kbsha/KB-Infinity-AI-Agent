<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Note Agent</title>

<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: "Inter", Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    height: 100vh;
}

/* ===== CONTAINER ===== */
.container {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    padding: 20px;
}

/* ===== HEADER ===== */
header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    font-size: 28px;
    color: #38bdf8;
}

/* ===== CHAT BOX ===== */
#chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: #111827;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* ===== MESSAGE ===== */
.message {
    padding: 12px;
    border-radius: 10px;
    max-width: 80%;
    white-space: pre-wrap;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.bot {
    background: #1f2937;
    align-self: flex-start;
}

/* ===== INPUT AREA ===== */
.input-box {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #1f2937;
    color: white;
}

button {
    padding: 12px 18px;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #0ea5e9;
}

/* ===== LOADING ===== */
.loading {
    opacity: 0.6;
}
</style>
</head>

<body>

<div class="container">
    <header>
        <h1>🤖 AI Note Agent</h1>
    </header>

    <div id="chatBox"></div>

    <div class="input-box">
        <input id="input" placeholder="Ask something..." />
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("input");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("message", type);
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function send() {
    const text = input.value;
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const loadingMsg = document.createElement("div");
    loadingMsg.classList.add("message", "bot", "loading");
    loadingMsg.textContent = "Thinking...";
    chatBox.appendChild(loadingMsg);

    try {
        const res = await fetch("/agent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();

        loadingMsg.remove();
        addMessage(data.response, "bot");

    } catch (err) {
        loadingMsg.remove();
        addMessage("Error: " + err.message, "bot");
    }
}
</script>

</body>
</html>
